name: Branch flow

on:
  pull_request:
    branches: [dev, test, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  actions: read

jobs:
  branch-flow:
    name: Branch flow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          # Use the target branch's rules, with history for the ancestry check.
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check the allowed source and production test result
        run: node scripts/branch-flow.mjs
        env:
          GH_TOKEN: ${{ github.token }}
